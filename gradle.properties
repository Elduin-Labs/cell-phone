# Tuned for an 8 GB machine. Building Minecraft is memory-hungry: each version
# under versions/ decompiles and remaps its own copy of the game.
#
# Do NOT turn parallel back on here. With more than one Minecraft version in the
# build, parallel + Loom will exhaust RAM and take the whole machine down with it.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.configuration-cache=true
org.gradle.caching=true
